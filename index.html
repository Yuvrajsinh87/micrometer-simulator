<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>આઉટસાઇડ માઇક્રોમીટર (0–25 mm)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { margin: 0 0 5px 0; font-size: 20px; }
        p.subtitle { color: #666; font-size: 14px; margin-top: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab.active {
            background: #1a252f;
            color: white;
        }

        .canvas-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .reading-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .reading-value {
            font-size: 28px;
            font-weight: bold;
            color: #1a252f;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active { background: #e0e0e0; }

        .slider {
            width: 100%;
            margin-bottom: 15px;
        }

        .guide-box {
            background: #fafafa;
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .guide-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>આઉટસાઇડ માઇક્રોમીટર (0–25 mm)</h2>
    <p class="subtitle">થિમ્બલ ફેરવો, સ્કેલ વાંચો, રીડિંગ શીખો.</p>

    <div class="nav-tabs">
        <div class="tab active">શીખો</div>
        <div class="tab">રીડિંગ લો</div>
        <div class="tab">સેટ કરો</div>
    </div>

    <div class="canvas-container">
        <canvas id="micrometerCanvas" width="400" height="180"></canvas>
    </div>

    <div class="reading-display">
        <span>રીડિંગ</span>
        <span class="reading-value" id="valTotal">0.00 mm</span>
    </div>

    <div class="controls">
        <button class="btn" onclick="adjustValue(-0.50)">-0.50</button>
        <button class="btn" onclick="adjustValue(-0.01)">-0.01</button>
        <button class="btn" onclick="adjustValue(0.01)">+0.01</button>
        <button class="btn" onclick="adjustValue(0.50)">+0.50</button>
    </div>

    <input type="range" id="micrometerSlider" class="slider" min="0" max="25" step="0.01" value="19.92" oninput="updateFromSlider(this.value)">
    <p style="font-size: 12px; color: #666; text-align: center; margin-top: 0;">સ્લાઇડરથી ઝડપી, બટનથી ચોક્કસ ગોઠવણ કરો.</p>

    <div class="guide-box">
        <h4 style="margin: 0 0 10px 0;">રીડિંગ કેવી રીતે લેવું</h4>
        <div class="guide-row">
            <span>🔹 સ્લીવ પર દેખાતો છેલ્લો mm</span>
            <b id="valMain">0 mm</b>
        </div>
        <div class="guide-row">
            <span>🔸 નીચે અડધો mm (0.50) દેખાય છે?</span>
            <b id="valSub">ના -> 0.00</b>
        </div>
        <div class="guide-row">
            <span>🔹 થિમ્બલ ડિવિઝન (x 0.01 mm)</span>
            <b id="valThimble">0.00 mm</b>
        </div>
    </div>
</div>

<script>
    let currentValue = 19.92;

    const canvas = document.getElementById('micrometerCanvas');
    const ctx = canvas.getContext('2d');

    function drawMicrometer(val) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sleeve background
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(20, 50, 220, 80);
        
        // Datum Line
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(20, 90);
        ctx.lineTo(240, 90);
        ctx.stroke();

        // Main Scale markings (Sleeve)
        let startMM = Math.max(0, Math.floor(val) - 5);
        for (let i = startMM; i <= startMM + 8; i++) {
            let x = 40 + (i - startMM) * 20;
            
            // Upper MM mark
            ctx.beginPath();
            ctx.moveTo(x, 90);
            ctx.lineTo(x, 65);
            ctx.stroke();
            ctx.font = '12px Arial';
            ctx.fillStyle = '#000';
            ctx.fillText(i, x - 5, 58);

            // Lower 0.5MM mark
            let xSub = x + 10;
            ctx.beginPath();
            ctx.moveTo(xSub, 90);
            ctx.lineTo(xSub, 110);
            ctx.stroke();
        }

        // Thimble
        let thimbleX = 180;
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(thimbleX, 30, 140, 120);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(thimbleX, 30, 140, 120);

        // Thimble Markings
        let thimbleVal = Math.round((val % 0.5) * 100);
        if (thimbleVal >= 50) thimbleVal -= 50;

        for (let i = -5; i <= 5; i++) {
            let markNum = (thimbleVal + i + 50) % 50;
            let y = 90 - (i * 12);

            if (y > 35 && y < 145) {
                ctx.beginPath();
                ctx.moveTo(thimbleX, y);
                ctx.lineTo(thimbleX + 25, y);
                ctx.stroke();

                if (markNum % 5 === 0) {
                    ctx.font = '11px Arial';
                    ctx.fillStyle = '#000';
                    ctx.fillText(markNum, thimbleX + 30, y + 4);
                }
            }
        }

        // Datum Line Indicator Arrow
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.moveTo(thimbleX - 10, 90);
        ctx.lineTo(thimbleX - 2, 85);
        ctx.lineTo(thimbleX - 2, 95);
        ctx.fill();
    }

    function updateApp() {
        document.getElementById('valTotal').innerText = currentValue.toFixed(2) + ' mm';
        document.getElementById('micrometerSlider').value = currentValue;

        let mainMM = Math.floor(currentValue);
        let remainder = currentValue - mainMM;
        let subMM = remainder >= 0.5 ? 0.50 : 0.00;
        let thimbleVal = (remainder - subMM).toFixed(2);

        document.getElementById('valMain').innerText = mainMM + ' mm';
        document.getElementById('valSub').innerText = subMM > 0 ? 'હા -> 0.50' : 'ના -> 0.00';
        document.getElementById('valThimble').innerText = thimbleVal + ' mm';

        drawMicrometer(currentValue);
    }

    function adjustValue(delta) {
        currentValue = Math.min(25, Math.max(0, currentValue + delta));
        updateApp();
    }

    function updateFromSlider(val) {
        currentValue = parseFloat(val);
        updateApp();
    }

    // Initial Load
    updateApp();
</script>

</body>
</html>
